<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Large left-pointing triangle (cyan) -->
  <polygon points="0,50 50,0 50,100" fill="#00C0E8"/>
  <!-- Top-right triangle (white) -->
  <polygon points="50,0 100,50 50,50" fill="#ffffff"/>
  <!-- Bottom-right triangle (cyan) -->
  <polygon points="50,50 100,50 50,100" fill="#00C0E8"/>
</svg>